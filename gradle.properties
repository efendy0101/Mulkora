# Project-wide Gradle settings
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM bellek ayarları — büyük multi-module proje için artırıldı
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Paralel build
org.gradle.parallel=true

# Build cache
org.gradle.caching=true

# Configuration cache (Gradle 7+ ile kararlı)
org.gradle.configuration-cache=true

# Android specific
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official

# Compose compiler reports (sadece geliştirme sırasında aktifleştir)
# compose.reports.enabled=true
# compose.metrics.enabled=true

# Non-final class uyarısını bastır
kotlin.stdlib.jdk.variants.version.alignment=false

# Gerektiğinde aşağıdakini yerel .properties dosyasına ekle:
# ADMOB_APP_ID=ca-app-pub-xxx~xxx
# RELEASE_KEYSTORE_PATH=path/to/release.keystore
# RELEASE_KEYSTORE_PASSWORD=yourpassword
# RELEASE_KEY_ALIAS=youralias
# RELEASE_KEY_PASSWORD=yourkeypassword
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
