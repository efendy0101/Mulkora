[versions]
# Build tools
agp = "8.13.2"
kotlin = "2.0.0"
ksp = "2.0.0-1.0.23"

# AndroidX
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.3"
activityCompose = "1.9.0"
composeBom = "2024.06.00"
navigationCompose = "2.7.7"
hiltNavigationCompose = "1.2.0"
paging3 = "3.3.1"
workManager = "2.9.0"
room = "2.6.1"
dataStore = "1.1.1"
coreSplashscreen = "1.0.1"
coil = "2.7.0"
appcompat = "1.7.0"
exifinterface = "1.3.7"

# Coroutines
coroutines = "1.8.1"

# Hilt
hilt = "2.51.1"

# Firebase / Google
googleServices = "4.4.2"
firebaseBom = "33.1.2"
